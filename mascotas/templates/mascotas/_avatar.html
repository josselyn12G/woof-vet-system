{# Foto de la mascota o, si no tiene, la inicial de su nombre. Usa la variable "mascota" de la plantilla que lo incluye #}
{% if mascota.tiene_foto %}<img src="{% url 'mascotas:foto' mascota.pk %}?v={{ mascota.actualizado|date:'U' }}" alt="">{% else %}<span class="avatar-inicial">{{ mascota.nombre|slice:':1'|upper }}</span>{% endif %}
