name: Release

# Se ejecuta al subir un tag de versión, por ejemplo: git push origin v1.0.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear Release con notas automáticas
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
